[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Solidity version - 0.8.27 required for OpenZeppelin confidential contracts
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Remappings for fhEVM and OpenZeppelin confidential contracts
remappings = [
    "@fhevm/solidity/=lib/fhevm-solidity/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/confidential-contracts/=lib/openzeppelin-confidential-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Sepolia Testnet Configuration
[rpc_endpoints]
# Recommended: set SEPOLIA_RPC_URL in your environment
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }

# Test configuration
[fuzz]
runs = 256

[invariant]
runs = 256
depth = 15
fail_on_revert = false
